[package]
name = "xnetify"
version = "0.1.0"
description = "跨平台代理注入工具"
authors = ["Xnetify Team"]
edition = "2021"

[lib]
name = "xnetify_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["socks", "rustls-tls"] }
dirs = "6"

